<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉稿到 HTML｜Amber Deck Skill</title>
<style>
*{box-sizing:border-box}html{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#131316;background:#f8f7f5}body{max-width:1440px;margin:auto;padding:clamp(20px,4.4vw,65px)}p,h1,h2{margin:0}header{margin-bottom:clamp(20px,3.3vw,48px)}small,strong em{color:#c40035}small{font-size:clamp(14px,1.5vw,20px);font-weight:750}h1{font-size:clamp(32px,5.15vw,76px);margin:12px 0;line-height:1.15;letter-spacing:-.045em}em{color:#e4003a;font-style:normal}
.work{background:white;display:grid;grid-template-columns:minmax(140px,17%) 1fr;border:1px solid #e5e0db;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #17141410;min-height:430px}nav{padding:26px 15px;border-right:1px solid #e8e4e0;background:#fbfaf9;display:flex;flex-direction:column;gap:6px}button{font:inherit;font-size:clamp(16px,2vw,25px);font-weight:720;text-align:left;padding:16px;background:transparent;border:0;border-left:4px solid transparent;border-radius:7px;cursor:pointer}button:focus-visible{outline:2px solid #b90035}button[aria-pressed=true]{background:#fbedf1;color:#b90035;border-left-color:#e4003a}.main{padding:clamp(17px,3vw,44px)}.rail{padding-bottom:15px;border-bottom:1px solid #e8e4e0;display:flex;justify-content:space-between;font-size:clamp(14px,1.6vw,22px)}.rail span{color:#5d5d68}h2{font-size:clamp(25px,4vw,58px);margin:22px 0;line-height:1.18}.signal{border-left:2px solid #e0d7d7;padding-left:14px;font-size:clamp(16px,2vw,27px);line-height:1.5;margin:12px 0;color:#494650}.decision{padding:15px 18px;border-radius:9px;background:#fbe5ea;margin-top:25px;font-size:clamp(16px,1.8vw,24px);line-height:1.5}.decision b{color:#a6002e}footer{font-size:15px;color:#5d5d68;margin:24px 0}.pulse{animation:step .23s ease-out}@keyframes step{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}@media(max-width:620px){.work{grid-template-columns:1fr;min-height:0}nav{flex-direction:row;flex-wrap:wrap;padding:10px;gap:3px;border-right:0;border-bottom:1px solid #e8e4e0}button{padding:8px}h2{margin:17px 0}}
</style></head><body>
<header><small>运营工作台</small><h1>每一轮，都<em>留下证据</em></h1></header>
<section class="work" aria-label="工作台交互示例">
<nav aria-label="流程阶段"><button data-index="0" aria-pressed="true">洞察</button><button data-index="1" aria-pressed="false">内容</button><button data-index="2" aria-pressed="false">投放</button><button data-index="3" aria-pressed="false">复盘</button></nav>
<div class="main" aria-live="polite"><div class="rail"><b>运营工作台</b><span>流程示意</span></div><h2>用户为什么还不买？</h2><p class="signal" id="one">核心价值还没讲透，用户仍在观望和对比。</p><p class="signal" id="two">关键顾虑没有打消，还需要可核验的证据。</p><p class="decision"><b>下一步决策：</b><span>找出一个待验证的顾虑，做成下一轮的内容题目。</span></p></div></section>
<footer>虚构示例 · 可离线打开。切换左侧阶段看问题、证据和下一步如何一起变化。</footer>
<script>
const states=[
 ['用户为什么还不买？','核心价值还没讲透，用户仍在观望和对比。','关键顾虑没有打消，还需要可核验的证据。','找出一个待验证的顾虑，做成下一轮的内容题目。'],
 ['哪条内容能回答这个问题？','先把产品事实和使用范围写进内容简报。','把可能产生误解的措辞单独标记。','选一条讲得清、可以验证的内容进入测试。'],
 ['哪一组值得继续测试？','把预算和停止条件写清，再开启小额测试。','区分内容互动与可以回传的实际结果。','先处理异常，再按约定窗口判断正常计划。'],
 ['下一轮改什么？','结果要回到之前的假设、内容和选择。','记录继续、暂停或换方向的理由。','把复盘结论写回下一轮的选题和内容简报。']
];
const buttons=[...document.querySelectorAll('button')],title=document.querySelector('h2'),one=document.querySelector('#one'),two=document.querySelector('#two'),action=document.querySelector('.decision span');
buttons.forEach((b,i)=>b.addEventListener('click',()=>{buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));[title,one,two,action].forEach((e,j)=>e.textContent=states[i][j]);title.classList.remove('pulse');void title.offsetWidth;title.classList.add('pulse');}));
</script></body></html>
