<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amber Deck Skill · Offline sample</title>
<style>
:root{color-scheme:dark;--paper:#f6f1e9;--ink:#201d19;--soft:#5c554d;--line:#cfc4b7;--accent:#ad3825;--white:#fff7eb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{background:#211e1b;display:grid;justify-items:center;align-content:center;min-height:100dvh}
.stage{width:min(100vw,calc((100dvh - 56px)*16/9));aspect-ratio:16/9;container-type:inline-size;background:var(--paper);color:var(--ink);position:relative}
.slide{position:absolute;inset:0;padding:5.5cqw 6.3cqw 4.2cqw;display:flex;flex-direction:column;justify-content:space-between}
[hidden]{display:none!important}
.kicker,.folio{font:700 1.05cqw/1.3 system-ui,sans-serif;letter-spacing:.14em;color:var(--accent)}
.folio{font-size:.86cqw;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:1.2cqw;color:var(--soft)}
h1,h2,p{margin:0}
h1{font-size:6.9cqw;letter-spacing:-.025em;line-height:1.1;font-weight:800}
h2{font-size:4.5cqw;line-height:1.15;letter-spacing:-.018em}
p{font-size:1.8cqw;line-height:1.65;color:var(--soft);max-width:38em}
em{font-style:normal;color:var(--accent)}
.coverline{display:block;border-left:.4cqw solid var(--accent);padding-left:2cqw;margin-top:2.6cqw}
.evidence{display:grid;grid-template-columns:1fr 1.25fr;align-items:center;gap:5cqw}
.evidence p{margin-top:1.7cqw}
.compare{margin:0;border-block:1px solid var(--line)}
.compare div{display:grid;grid-template-columns:2.7cqw 10.5cqw auto;gap:1cqw;align-items:center;padding:1.4cqw 0;border-top:1px solid var(--line)}
.compare div:first-child{border-top:0}
.compare span{color:var(--accent);font-size:1.1cqw;font-weight:750}
.compare dt{font-weight:750;font-size:1.5cqw}
.compare dd{margin:0;color:var(--soft);font-size:1.3cqw}
.dark{background:#221c18;color:var(--white);--soft:#d1c4b6;--accent:#f58e74;--line:#67564d}
.dark h2{font-size:6cqw;max-width:12em}
.dark p{margin-top:1.5cqw}
.black .slide{visibility:hidden}.black{background:#000}
.controls{display:flex;align-items:center;gap:.55rem;margin:.55rem 0;font-size:.82rem;color:#f9f1e9}
button{border:1px solid #7a6b60;background:#2b2520;color:#fff8f0;border-radius:4px;padding:.35rem .62rem;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid #f58e74;outline-offset:2px}
.animate .active .reveal{animation:rise 270ms cubic-bezier(.2,.7,.22,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.animate .active .reveal{animation:none}}
@media screen and (max-width:600px){body{align-content:start;padding:12px}.stage{width:100%;height:auto;min-height:70dvh;aspect-ratio:auto}.slide{position:relative;min-height:70dvh;padding:28px 24px;gap:32px}.kicker,.folio{font-size:11px}h1{font-size:clamp(29px,10.5cqw,48px)}h2,.dark h2{font-size:clamp(26px,8.5cqw,40px)}p{font-size:16px}.coverline{padding-left:12px;margin-top:18px}.evidence{display:flex;flex-direction:column;align-items:stretch;gap:24px}.evidence p,.dark p{margin-top:14px}.compare div{grid-template-columns:22px 43px 1fr;gap:8px;padding:9px 0}.compare span,.compare dt,.compare dd{font-size:13px}.folio{padding-top:12px}.controls{flex-wrap:wrap;justify-content:center}}
@media print{body{display:block;background:white}.stage{width:100%;height:auto;aspect-ratio:auto}.slide,.slide[hidden]{display:flex!important;position:relative;visibility:visible!important;aspect-ratio:16/9;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slide:last-child{break-after:auto}.controls{display:none}@page{size:13.333in 7.5in;margin:0}}
</style>
</head>
<body>
<main class="stage animate" aria-label="示范演示">
<section class="slide" data-title="开场">
<div class="kicker">01 / 开场</div>
<div class="reveal"><h1>让每次交接<br><em>少追问一轮</em></h1><p class="coverline">从一张交接单开始，把任务、输入和验收放在一起。</p></div>
<div class="folio"><span>虚构示范 · 供设计参考</span><span>01 / 03</span></div>
</section>
<section class="slide" data-title="交接单" hidden>
<div class="kicker">02 / 操作</div>
<div class="evidence"><div><h2>交接单只保留<br>三个必填项</h2><p>接手人第一次打开，就能知道该从哪里开始。</p></div><dl class="compare reveal">
<div><span>01</span><dt>任务</dt><dd>改写一封邀请邮件</dd></div>
<div><span>02</span><dt>输入</dt><dd>活动说明和收件人范围</dd></div>
<div><span>03</span><dt>验收</dt><dd>时间、地址和报名方式齐全</dd></div>
</dl></div>
<div class="folio"><span>虚构示范 · 交接单样例</span><span>02 / 03</span></div>
</section>
<section class="slide dark" data-title="下一步" hidden>
<div class="kicker">03 / 决策</div>
<div class="reveal"><h2>挑一件真实任务，<br>试填一张交接单</h2><p>让接手人圈出缺失的信息，再决定哪些字段应进入团队模板。</p></div>
<div class="folio"><span>虚构示范 · 下一步</span><span>03 / 03</span></div>
</section>
</main>
<nav class="controls" aria-label="演示控件">
<button id="prev" type="button">上一页</button><span id="status" aria-live="polite"></span><button id="next" type="button">下一页</button>
<button id="motion" type="button" aria-pressed="true">动效</button><button id="black" type="button" aria-pressed="false">黑屏</button>
</nav>
<script>
const stage=document.querySelector('.stage'), slides=[...stage.querySelectorAll('section')];
const find=id=>document.getElementById(id);
let current=0;
function show(i,update=true){
 current=Math.min(slides.length-1,Math.max(0,Number.isFinite(i)?i:0));
 slides.forEach((node,j)=>{node.hidden=j!==current;node.classList.toggle('active',j===current)});
 find('status').textContent=(current+1)+' / '+slides.length;
 find('prev').disabled=current===0;find('next').disabled=current===slides.length-1;
 if(update)history.replaceState(null,'','#'+(current+1));
}
function fromHash(){show(parseInt(location.hash.slice(1),10)-1,false)}
function toggle(id,klass){
 const active=stage.classList.toggle(klass);find(id).setAttribute('aria-pressed',String(active));
}
find('prev').onclick=()=>show(current-1);find('next').onclick=()=>show(current+1);
find('black').onclick=()=>toggle('black','black');find('motion').onclick=()=>toggle('motion','animate');
addEventListener('hashchange',fromHash);
addEventListener('keydown',event=>{
 if(event.altKey||event.metaKey||event.ctrlKey)return;
 if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
  event.preventDefault();show(current+(event.key==='ArrowRight'?1:-1));
 }else if(event.key.toLowerCase()==='b')find('black').click();
 else if(event.key.toLowerCase()==='r'){
  slides[current].classList.remove('active');void slides[current].offsetWidth;slides[current].classList.add('active');
 }
});
fromHash();
</script>
</body>
</html>
