<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环形占比依次扫出</title>
<!-- 24-donut-build · 来源：原创 · 原创实现，无第三方代码。GSAP 3.13.0（GreenSock Standard License）由固定版本 CDN 引入；离线或加载失败时显示静态终态。 -->
<!-- 参数：?end 直接静态终态（打印/截图）· ?rm 模拟减少动效 · ?clean 隐藏提示条 -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<style>
:root{--bg:#F8F7F5;--fg:#0E0F13;--accent:#E4003A;--muted:#636874;--faint:#9AA0AB;--line:#E2DED7;--card:#FFFFFF;--soft:#FDF1F4;--page:#E9E7E3;--ease:cubic-bezier(.16,1,.3,1)}
body.dark{--bg:#121113;--fg:#F5F2EE;--accent:#FF3369;--muted:#A9A2A6;--faint:#6F6970;--line:#2C292E;--card:#1C1A1E;--soft:#2A1520;--page:#060607}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--fg)}
h1,h2,h3,p{margin:0}
.pad{position:absolute;inset:64px 88px 72px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.h1{font-size:76px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
.h2{font-size:46px;line-height:1.22;font-weight:800;letter-spacing:-.015em}
.h3{font-size:26px;line-height:1.35;font-weight:750}
.lead{font-size:21px;line-height:1.7;color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.accent{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.note{position:absolute;right:88px;bottom:26px;font-size:12px;color:var(--faint)}
.fx-hud{position:absolute;left:24px;bottom:18px;z-index:999;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--faint);pointer-events:none;letter-spacing:.02em}
.fx-hud b{font-weight:600;color:var(--muted)}
.fx-hud .fx-step{font-variant-numeric:tabular-nums}
.fx-clean .fx-hud{display:none}
@media print{html,body{overflow:visible;background:var(--bg)}#stage{position:relative;transform:none!important}.fx-hud{display:none}}

/* ---- effect ---- */
.head{position:absolute;left:88px;top:64px}
.head .h2{margin-top:12px;font-size:40px}
svg.dn{position:absolute;left:250px;top:180px;width:520px;height:520px;overflow:visible}
.seg{fill:none;stroke-width:62}
.ctr{position:absolute;left:250px;top:180px;width:520px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ctr b{font-size:76px;font-weight:850;font-variant-numeric:tabular-nums}.ctr span{font-size:15px;color:var(--muted)}
.lg{position:absolute;left:860px;top:270px;width:420px}
.lg div{display:flex;align-items:center;gap:14px;height:68px;border-bottom:1px solid var(--line);font-size:20px}
.lg i{width:14px;height:14px;border-radius:4px}
.lg em{margin-left:auto;font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
</style>
</head>
<body class="dark">
<div id="stage" data-keys="→ / 空格 突出最大一段 · ← 收回 · E 终态">
<div class="head"><div class="eyebrow">Mix · 构成</div><h2 class="h2">四类构成，<span class="accent">一类占了大头</span></h2></div>
<svg class="dn" viewBox="-260 -260 520 520" aria-hidden="true"><g class="segs" transform="rotate(-90)"></g></svg>
<div class="ctr"><b>100%</b><span>合计（示例）</span></div>
<div class="lg"></div>
<div class="note">示例数据，非真实业务数字</div>
</div>
<script>
/* 共享运行时：舞台缩放、步进、减少动效、静态终态。原创。 */
window.FX=(function(){
  var q=new URLSearchParams(location.search);
  var RM=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||q.has('rm');
  var END=q.has('end');
  var G=window.gsap;
  var stage=document.getElementById('stage');
  if(q.has('clean'))document.body.classList.add('fx-clean');
  function fit(){var s=Math.min(innerWidth/1440,innerHeight/810);stage.style.transform='translate('+(innerWidth-1440*s)/2+'px,'+(innerHeight-810*s)/2+'px) scale('+s+')';}
  addEventListener('resize',fit);fit();
  var api={RM:RM,END:END,G:G,stage:stage,ready:false,i:0,P:[1],tl:null,loops:[],
    $:function(s,r){return (r||stage).querySelector(s)},
    $$:function(s,r){return Array.prototype.slice.call((r||stage).querySelectorAll(s))}};
  var hudStep=null,opts={};
  function label(){if(hudStep)hudStep.textContent=api.P.length>1?(api.i+1)+' / '+api.P.length:(api.END||api.RM||!G?'终态':'');}
  function go(i,instant){
    if(!api.tl)return;
    i=Math.max(0,Math.min(api.P.length-1,i));
    var back=i<api.i; api.i=i;
    var t=api.P[i];
    if(instant||RM){api.tl.pause();api.tl.seek(t,false);}
    else if(back){api.tl.tweenTo(t,{duration:Math.min(.6,Math.max(.25,Math.abs(api.tl.time()-t))),ease:'power2.inOut'});}
    else api.tl.tweenTo(t);
    if(opts.onStep)opts.onStep(i);
    label();
  }
  api.go=function(i){go(i)};
  api.hide=function(tl,t){tl.fromTo(t,{autoAlpha:0},{autoAlpha:0,duration:.001,immediateRender:true},0);return tl;};
  api.next=function(){go(api.i+1)};
  api.prev=function(){go(api.i-1)};
  api.end=function(){api.loops.forEach(function(l){l.pause&&l.pause()});go(api.P.length-1,true);if(opts.staticEnd&&!api.tl)opts.staticEnd();};
  api.restart=function(){if(!api.tl)return;api.tl.pause().seek(0,false);api.i=-1;go(0)};
  api.state=function(){var t=api.tl;return {i:api.i,n:api.P.length,progress:t?t.progress():1,active:t?t.isActive():false,gsap:!!G,rm:RM,loops:api.loops.filter(function(l){return l.isActive&&l.isActive()}).length}};
  api.setup=function(o){
    opts=o||{};
    var hud=document.createElement('div');hud.className='fx-hud';
    hud.innerHTML='<b>'+document.title+'</b><span class="fx-step"></span><span>'+(stage.dataset.keys||'→ / 空格 下一步 · ← 回退 · E 终态 · R 重播')+'</span>';
    stage.appendChild(hud);hudStep=hud.querySelector('.fx-step');
    if(!G){stage.classList.add('fx-static');if(opts.staticEnd)opts.staticEnd();api.ready=true;label();return;}
    G.defaults({ease:'power3.out',duration:.8});
    var tl=opts.build(G);api.tl=tl;tl.pause();
    var P=Object.keys(tl.labels).filter(function(k){return /^s\d+$/.test(k)}).map(function(k){return tl.labels[k]});
    P.push(tl.duration());
    P=P.sort(function(a,b){return a-b}).filter(function(t,k,a){return k===0||t-a[k-1]>1e-3});
    api.P=P;
    if(END||(RM&&P.length===1)){tl.progress(1,false);api.i=P.length-1;}
    else if(RM){tl.seek(P[0],false);api.i=0;}
    else {api.i=0;tl.tweenTo(P[0]);}
    if(opts.onStep)opts.onStep(api.i);
    if(opts.loop){var made=opts.loop(G)||[];api.loops=made;if(RM||END)made.forEach(function(l){l.pause()});}
    label();api.ready=true;
  };
  var wheelLock=0;
  addEventListener('wheel',function(e){var n=Date.now();if(n<wheelLock||Math.abs(e.deltaY)<8)return;wheelLock=n+700;e.deltaY>0?api.next():api.prev();},{passive:true});
  addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(opts.keys&&opts.keys[e.key.toLowerCase()]){opts.keys[e.key.toLowerCase()](e);return;}
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].indexOf(e.key)>-1){e.preventDefault();api.next();}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(e.key)>-1){e.preventDefault();api.prev();}
    else if(e.key==='End'||e.key.toLowerCase()==='e'){e.preventDefault();api.end();}
    else if(e.key==='Home'||e.key.toLowerCase()==='r'){e.preventDefault();api.restart();}
    else if(e.key.toLowerCase()==='h'){document.body.classList.toggle('fx-clean');}
  });
  stage.addEventListener('click',function(e){if(e.target.closest('button,a,input,[data-noclick]'))return;api.next();});
  return api;
})();
</script>
<script>
const D=[[46,'类别 A','#FF3369'],[24,'类别 B','#B9B2B6'],[18,'类别 C','#6F6970'],[12,'类别 D','#3E3A40']],R=190,C=2*Math.PI*R,NS='http://www.w3.org/2000/svg',segs=[];
let acc=0;D.forEach(([v,n,col],k)=>{const c=document.createElementNS(NS,'circle');c.setAttribute('class','seg');c.setAttribute('r',R);c.setAttribute('stroke',col);const len=v/100*C-4;c.setAttribute('stroke-dasharray',len+' '+C);c.setAttribute('stroke-dashoffset',-acc/100*C);c.dataset.len=len;c.dataset.mid=(acc+v/2)/100*2*Math.PI;acc+=v;FX.$('.segs').appendChild(c);segs.push(c);
  const r=document.createElement('div');r.innerHTML=`<i style="background:${col}"></i>${n}<em>${v}%</em>`;FX.$('.lg').appendChild(r);});
const tot=FX.$('.ctr b'),o={v:100};
FX.setup({
  build(g){
    const tl=g.timeline();
    tl.from('.head > *',{autoAlpha:0,y:30,stagger:.1,duration:.9,ease:'expo.out'},0);
    segs.forEach((s,k)=>tl.fromTo(s,{attr:{'stroke-dasharray':'0 '+C}},{attr:{'stroke-dasharray':s.dataset.len+' '+C},duration:.7,ease:'power2.inOut'},.4+k*.45));
    tl.fromTo(o,{v:0},{v:100,duration:2,ease:'power2.out',onUpdate:()=>tot.textContent=Math.round(o.v)+'%'},.4);
    tl.from('.lg div',{autoAlpha:0,x:20,stagger:.45,duration:.5},.6);
    tl.addLabel('s1');
    const m=+segs[0].dataset.mid;
    tl.to(segs[0],{x:Math.cos(m)*24,y:Math.sin(m)*24,duration:.6,ease:'back.out(2)'},'s1');
    tl.to(segs.slice(1),{opacity:.35,duration:.5},'s1');
    tl.to(FX.$$('.lg div').slice(1),{opacity:.4,duration:.5},'s1');
    return tl;
  },
  staticEnd(){const m=+segs[0].dataset.mid;segs[0].setAttribute('transform',`translate(${Math.cos(m)*24},${Math.sin(m)*24})`);segs.slice(1).forEach(x=>x.style.opacity=.35);FX.$$('.lg div').slice(1).forEach(x=>x.style.opacity=.4);}
});
</script>
</body>
</html>
