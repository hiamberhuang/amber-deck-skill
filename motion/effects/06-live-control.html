<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>现场控台同步</title>
<!-- 06-live-control · 来源：Amber signature（闭幕直播控台：控台与舞台用 BroadcastChannel 加 localStorage 同步状态，窗口刷新可恢复当前场景） · 原创实现，无第三方代码。GSAP 3.13.0（GreenSock Standard License）由固定版本 CDN 引入；离线或加载失败时显示静态终态。 -->
<!-- 参数：?end 直接静态终态（打印/截图）· ?rm 模拟减少动效 · ?clean 隐藏提示条 -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<style>
:root{--bg:#F8F7F5;--fg:#0E0F13;--accent:#E4003A;--muted:#636874;--faint:#9AA0AB;--line:#E2DED7;--card:#FFFFFF;--soft:#FDF1F4;--page:#E9E7E3;--ease:cubic-bezier(.16,1,.3,1)}
body.dark{--bg:#121113;--fg:#F5F2EE;--accent:#FF3369;--muted:#A9A2A6;--faint:#6F6970;--line:#2C292E;--card:#1C1A1E;--soft:#2A1520;--page:#060607}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--fg)}
h1,h2,h3,p{margin:0}
.pad{position:absolute;inset:64px 88px 72px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.h1{font-size:76px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
.h2{font-size:46px;line-height:1.22;font-weight:800;letter-spacing:-.015em}
.h3{font-size:26px;line-height:1.35;font-weight:750}
.lead{font-size:21px;line-height:1.7;color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.accent{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.note{position:absolute;right:88px;bottom:26px;font-size:12px;color:var(--faint)}
.fx-hud{position:absolute;left:24px;bottom:18px;z-index:999;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--faint);pointer-events:none;letter-spacing:.02em}
.fx-hud b{font-weight:600;color:var(--muted)}
.fx-hud .fx-step{font-variant-numeric:tabular-nums}
.fx-clean .fx-hud{display:none}
@media print{html,body{overflow:visible;background:var(--bg)}#stage{position:relative;transform:none!important}.fx-hud{display:none}}

/* ---- effect ---- */
.cue{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 120px;opacity:0;visibility:hidden}
.cue:nth-child(4){opacity:1;visibility:visible}
.cue .eyebrow{margin-bottom:22px}
.c1{background:radial-gradient(ellipse at 80% 50%,#5c1430,#121113 65%)}
.c2{background:#0b0a0c;justify-content:flex-end;padding-bottom:120px}
.c2 .lower{display:flex;align-items:center;gap:26px;background:rgba(255,255,255,.06);border-left:4px solid var(--accent);padding:24px 34px;width:720px}
.c2 .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#3a3440,#1c1a1e)}
.c2 .lower b{display:block;font-size:34px}.c2 .lower span{color:var(--muted);font-size:18px}
.c3{flex-direction:row;align-items:center;gap:80px;background:#141215}
.qr{width:300px;height:300px;display:grid;grid-template-columns:repeat(11,1fr);gap:3px;padding:18px;background:#fff;border-radius:16px}
.qr i{background:#111;border-radius:1px}.qr i.o{background:#fff}
.c4{align-items:center;text-align:center;background:radial-gradient(circle at 50% 60%,#3d1022,#121113 60%)}
.panelbox{position:absolute;right:24px;top:24px;width:360px;background:rgba(28,26,30,.96);border:1px solid #333;border-radius:16px;padding:18px;z-index:50;display:none}
.panelbox.open{display:block}
.panelbox h4,.ctl h4{margin:0 0 12px;font-size:13px;letter-spacing:.12em;color:var(--muted)}
.cuebtn{display:block;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--fg);background:#232026;border:1px solid #333;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cuebtn.on{border-color:var(--accent);background:#3a1424}
.ctl{position:absolute;inset:0;padding:60px 80px;display:none;background:#0d0c0e}
body.control .ctl{display:block}
body.control .cue,body.control .panelbox{display:none}
.ctl .now{font-size:56px;font-weight:800;margin:10px 0 30px}
.ctl .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ctl .cuebtn{height:130px;font-size:22px}
.ctl .stat{margin-top:26px;color:var(--muted);font-size:15px}
</style>
</head>
<body class="dark">
<div id="stage" data-keys="→ / ← 切场景 · C 打开控台窗口 · P 舞台内控台 · E 终态">
<section class="cue c1"><div class="eyebrow">Opening · 场景 1</div><h1 class="h1">活动名称占位</h1><p class="lead" style="margin-top:20px">日期与地点占位</p></section>
<section class="cue c2"><div class="lower"><div class="av"></div><div><b>嘉宾姓名占位</b><span>身份说明占位</span></div></div></section>
<section class="cue c3"><div class="qr" aria-label="二维码占位"></div><div><div class="eyebrow">Interact · 场景 3</div><h2 class="h2">扫码参与互动</h2><p class="lead" style="margin-top:14px">互动说明占位，二维码为示意图案。</p></div></section>
<section class="cue c4"><div class="eyebrow">Thanks · 场景 4</div><h1 class="h1">谢谢</h1></section>
<div class="panelbox" data-noclick><h4>舞台内控台（P 关闭）</h4><div class="btns"></div><button class="cuebtn" data-open>打开独立控台窗口（C）</button></div>
<div class="ctl" data-noclick><h4>控台 · 同步到同一浏览器中打开的舞台窗口</h4><div class="now">—</div><div class="grid"></div><div class="stat"></div></div>
</div>
<script>
/* 共享运行时：舞台缩放、步进、减少动效、静态终态。原创。 */
window.FX=(function(){
  var q=new URLSearchParams(location.search);
  var RM=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||q.has('rm');
  var END=q.has('end');
  var G=window.gsap;
  var stage=document.getElementById('stage');
  if(q.has('clean'))document.body.classList.add('fx-clean');
  function fit(){var s=Math.min(innerWidth/1440,innerHeight/810);stage.style.transform='translate('+(innerWidth-1440*s)/2+'px,'+(innerHeight-810*s)/2+'px) scale('+s+')';}
  addEventListener('resize',fit);fit();
  var api={RM:RM,END:END,G:G,stage:stage,ready:false,i:0,P:[1],tl:null,loops:[],
    $:function(s,r){return (r||stage).querySelector(s)},
    $$:function(s,r){return Array.prototype.slice.call((r||stage).querySelectorAll(s))}};
  var hudStep=null,opts={};
  function label(){if(hudStep)hudStep.textContent=api.P.length>1?(api.i+1)+' / '+api.P.length:(api.END||api.RM||!G?'终态':'');}
  function go(i,instant){
    if(!api.tl)return;
    i=Math.max(0,Math.min(api.P.length-1,i));
    var back=i<api.i; api.i=i;
    var t=api.P[i];
    if(instant||RM){api.tl.pause();api.tl.seek(t,false);}
    else if(back){api.tl.tweenTo(t,{duration:Math.min(.6,Math.max(.25,Math.abs(api.tl.time()-t))),ease:'power2.inOut'});}
    else api.tl.tweenTo(t);
    if(opts.onStep)opts.onStep(i);
    label();
  }
  api.go=function(i){go(i)};
  api.hide=function(tl,t){tl.fromTo(t,{autoAlpha:0},{autoAlpha:0,duration:.001,immediateRender:true},0);return tl;};
  api.next=function(){go(api.i+1)};
  api.prev=function(){go(api.i-1)};
  api.end=function(){api.loops.forEach(function(l){l.pause&&l.pause()});go(api.P.length-1,true);if(opts.staticEnd&&!api.tl)opts.staticEnd();};
  api.restart=function(){if(!api.tl)return;api.tl.pause().seek(0,false);api.i=-1;go(0)};
  api.state=function(){var t=api.tl;return {i:api.i,n:api.P.length,progress:t?t.progress():1,active:t?t.isActive():false,gsap:!!G,rm:RM,loops:api.loops.filter(function(l){return l.isActive&&l.isActive()}).length}};
  api.setup=function(o){
    opts=o||{};
    var hud=document.createElement('div');hud.className='fx-hud';
    hud.innerHTML='<b>'+document.title+'</b><span class="fx-step"></span><span>'+(stage.dataset.keys||'→ / 空格 下一步 · ← 回退 · E 终态 · R 重播')+'</span>';
    stage.appendChild(hud);hudStep=hud.querySelector('.fx-step');
    if(!G){stage.classList.add('fx-static');if(opts.staticEnd)opts.staticEnd();api.ready=true;label();return;}
    G.defaults({ease:'power3.out',duration:.8});
    var tl=opts.build(G);api.tl=tl;tl.pause();
    var P=Object.keys(tl.labels).filter(function(k){return /^s\d+$/.test(k)}).map(function(k){return tl.labels[k]});
    P.push(tl.duration());
    P=P.sort(function(a,b){return a-b}).filter(function(t,k,a){return k===0||t-a[k-1]>1e-3});
    api.P=P;
    if(END||(RM&&P.length===1)){tl.progress(1,false);api.i=P.length-1;}
    else if(RM){tl.seek(P[0],false);api.i=0;}
    else {api.i=0;tl.tweenTo(P[0]);}
    if(opts.onStep)opts.onStep(api.i);
    if(opts.loop){var made=opts.loop(G)||[];api.loops=made;if(RM||END)made.forEach(function(l){l.pause()});}
    label();api.ready=true;
  };
  var wheelLock=0;
  addEventListener('wheel',function(e){var n=Date.now();if(n<wheelLock||Math.abs(e.deltaY)<8)return;wheelLock=n+700;e.deltaY>0?api.next():api.prev();},{passive:true});
  addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(opts.keys&&opts.keys[e.key.toLowerCase()]){opts.keys[e.key.toLowerCase()](e);return;}
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].indexOf(e.key)>-1){e.preventDefault();api.next();}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(e.key)>-1){e.preventDefault();api.prev();}
    else if(e.key==='End'||e.key.toLowerCase()==='e'){e.preventDefault();api.end();}
    else if(e.key==='Home'||e.key.toLowerCase()==='r'){e.preventDefault();api.restart();}
    else if(e.key.toLowerCase()==='h'){document.body.classList.toggle('fx-clean');}
  });
  stage.addEventListener('click',function(e){if(e.target.closest('button,a,input,[data-noclick]'))return;api.next();});
  return api;
})();
</script>
<script>
const KEY='fx-live-control-demo',CONTROL=new URLSearchParams(location.search).has('control');
const NAMES=['开场','嘉宾','互动','致谢'];
let bc=null;try{bc=new BroadcastChannel(KEY)}catch(e){}
let applying=false,cur=0;
const qr=FX.$('.qr');let seed=7;for(let k=0;k<121;k++){seed=(seed*9301+49297)%233280;const i=document.createElement('i');const r=Math.floor(k/11),c=k%11;const finder=(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);if(finder?((r%2===1&&c%2===1)&&!(r===1&&c===1)&&!(r===1&&c===9)&&!(r===9&&c===1)):seed/233280>.5)i.className='o';qr.appendChild(i);}
function publish(i){if(applying)return;const s={cue:i,v:Date.now()};try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}if(bc)bc.postMessage(s);}
function paint(i){cur=i;FX.$$('.cuebtn[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));FX.$('.ctl .now').textContent='当前：'+NAMES[i]+(i<NAMES.length-1?'　下一个：'+NAMES[i+1]:'');}
function apply(s){if(!s||typeof s.cue!=='number')return;applying=true;if(CONTROL)paint(s.cue);else FX.go(s.cue);applying=false;}
if(bc)bc.onmessage=e=>apply(e.data);
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{apply(JSON.parse(e.newValue))}catch(x){}}});
function mk(box){NAMES.forEach((n,i)=>{const b=document.createElement('button');b.className='cuebtn';b.dataset.i=i;b.textContent=(i+1)+' · '+n;b.onclick=()=>{if(CONTROL){paint(i);publish(i);}else FX.go(i);};box.appendChild(b);});}
const openCtl=()=>window.open(location.href.split('?')[0].split('#')[0]+'?control','fx-control','width=980,height=600');
if(CONTROL){
  document.body.classList.add('control');document.title='控台 · '+document.title;mk(FX.$('.ctl .grid'));
  FX.$('.ctl .stat').textContent=bc?'同步方式：BroadcastChannel + localStorage':'同步方式：localStorage';
  FX.setup({build:g=>g.timeline(),keys:{
    arrowright:()=>{const i=Math.min(NAMES.length-1,cur+1);paint(i);publish(i)},' ':()=>{const i=Math.min(NAMES.length-1,cur+1);paint(i);publish(i)},
    arrowleft:()=>{const i=Math.max(0,cur-1);paint(i);publish(i)}}});
  let s0=null;try{s0=JSON.parse(localStorage.getItem(KEY))}catch(e){}paint(s0&&typeof s0.cue==='number'?s0.cue:0);
}else{
  mk(FX.$('.panelbox .btns'));FX.$('[data-open]').onclick=openCtl;
  const cues=FX.$$('.cue');
  FX.setup({
    build(g){
      cues.forEach((c,j)=>g.set(c,{autoAlpha:j===0?1:0}));
      const tl=g.timeline();
      tl.from('.c1 > *',{autoAlpha:0,y:30,stagger:.12,duration:.9,ease:'expo.out'},0);
      for(let i=1;i<cues.length;i++){
        const at='s'+i;tl.addLabel(at);
        tl.to(cues[i-1],{autoAlpha:0,duration:.5},at);
        tl.to(cues[i],{autoAlpha:1,duration:.6},at+'+=.2');
        tl.from(cues[i].children,{autoAlpha:0,y:30,stagger:.1,duration:.8,ease:'expo.out',immediateRender:false},at+'+=.3');
      }
      return tl;
    },
    onStep(i){paint(i);publish(i);},
    keys:{c:openCtl,p:()=>FX.$('.panelbox').classList.toggle('open')}
  });
  if(!FX.G)paint(NAMES.length-1);
}
</script>
</body>
</html>
