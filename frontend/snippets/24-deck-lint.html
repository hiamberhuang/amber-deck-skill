<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="shot" content="1440x1200"><link rel="stylesheet" href="_base.css"><title>24 deck-lint：故意做坏的一页 + 体检报告</title>
<style>
/* 以下是「故意的反例」，用来验证 deck-lint.js 能抓到。不要复制。 */
.bad h1{font-size:45px;letter-spacing:-3px;background:linear-gradient(90deg,#7c3aed,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:none;text-wrap:initial}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:34px}
.cd{background:#fff;border-radius:14px;padding:22px;box-shadow:0 0 24px rgba(124,58,237,.35);border-left:4px solid #7c3aed}
.cd .t{font-size:20px;font-weight:600} .cd .d{font-size:14px;color:#b9bcc4;margin-top:8px;line-height:1.6}
.cd .in{margin-top:14px;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.12);font-size:10px;color:#636874;font-style:italic}
.wide{position:absolute;right:-40px;top:300px;font-size:13px;color:#636874}
/* 报告区（在画布外） */
#rep{width:1440px;padding:22px 68px 30px;background:#17161A;color:#EDEAF0;font-size:14.5px;line-height:1.9;columns:2;column-gap:60px;min-height:390px}
#rep b{display:inline-block;min-width:34px;color:#7FB6FF} #rep i{font-style:normal;color:#9c98a6}
#rep h3{column-span:all;font-size:17px;margin-bottom:6px;font-weight:600}
</style></head><body>
<div class="slide bad" style="padding-top:64px">
 <h1>线索管理三大能力，全面赋能销售团队提效</h1>
 <div class="cards">
  <div class="cd"><div class="t">自动分配</div><div class="d">按区域、行业和当前负载把线索直接推到个人手上去。</div><div class="in">本周分配 1,190 条</div></div>
  <div class="cd"><div class="t">超时升级</div><div class="d">超过十五分钟无人响应会自动升级给主管重新来分配。</div><div class="in">本周升级 86 条</div></div>
  <div class="cd"><div class="t">全程留痕</div><div class="d">每一次沟通都记录在案，月底复盘不用再翻聊天记录了。</div><div class="in">沟通记录 5,402 条</div></div>
 </div>
 <div class="wide">右侧这行字有一部分跑到画布外面去了</div>
</div>
<div id="rep"></div>
<script src="no-orphan.js"></script><script src="deck-lint.js"></script>
<script>
document.fonts.ready.then(function(){
  var slide=document.querySelector('.slide'), issues=deckLint(slide); deckLint.paint(issues);
  var by={}; issues.forEach(function(i){(by[i.rule]=by[i.rule]||[]).push(i)});
  document.getElementById('rep').innerHTML='<h3>deck-lint 报告：'+issues.length+' 条，'+Object.keys(by).length+' 类（蓝框实线 = P1，虚线 = P2）</h3>'+
    Object.keys(by).map(function(r){var a=by[r];return '<div><b>'+a[0].level+'</b>'+r+' × '+a.length+' <i>'+a[0].msg+'</i></div>'}).join('');
  document.documentElement.dataset.ready='1';
});
</script></body></html>
