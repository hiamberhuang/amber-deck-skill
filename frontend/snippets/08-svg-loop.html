<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>08 SVG 闭环：箭头落在圆上</title>
<style>
.wrap{display:grid;grid-template-columns:420px 1fr;gap:40px;align-items:center;height:100%}
svg text{font-family:var(--font-sans)}
h1{font-size:40px}
</style></head><body><div class="slide" style="padding-top:44px;padding-bottom:44px"><div class="wrap">
 <div><h1>线索闭环：四步首尾相接</h1><p class="sub">每一步的产出是下一步的输入，成交数据回到获客端修正投放。</p></div>
 <svg id="loop" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="获客、分配、跟进、成交的闭环"></svg>
</div></div>
<script>
/* 几何规则（全部算出来，不靠目测）：
   1. N 个节点均分圆周，第一个在正上方（-90°），顺时针。
   2. 弧线两端各退让 gap 角 = 节点半径对应的圆心角 + 6px 间隙，线不碰节点。
   3. 箭头是独立三角形：尖端在弧终点，朝向 = 该点切线方向（半径角 + 90°）；弧线再缩短一个箭头长，线头藏在箭头底边后面。
   4. 文字放在节点里，节点直径 ≥ 4 个字宽 + 2×16 内边距。 */
(function(){
  var NS='http://www.w3.org/2000/svg',svg=document.getElementById('loop');
  var cx=360,cy=360,R=236,r=74,head=15,sw=3;
  var steps=[['获客','多渠道进同一个池'],['分配','按规则推给个人'],['跟进','四分钟内首次响应'],['成交','数据回流修正投放']];
  var N=steps.length,rad=function(d){return d*Math.PI/180},pt=function(a,rr){return [cx+(rr||R)*Math.cos(rad(a)),cy+(rr||R)*Math.sin(rad(a))]};
  var gap=(r+8)/R*180/Math.PI, headDeg=head/R*180/Math.PI;
  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.appendChild(e);return e;}
  el('circle',{cx:cx,cy:cy,r:R,fill:'none',stroke:'#E7E4DE','stroke-width':1});          // 轨道底线
  for(var i=0;i<N;i++){
    var a0=-90+i*360/N+gap, a1=-90+(i+1)*360/N-gap, hot=i===N-1;                         // 最后一段「回流」是重点
    var p0=pt(a0), p1=pt(a1-headDeg), col=hot?'#E4003A':'#33363E';
    el('path',{d:'M'+p0+' A'+R+' '+R+' 0 0 1 '+p1,fill:'none',stroke:col,'stroke-width':sw,'stroke-linecap':'butt'});
    var tip=pt(a1), t=rad(a1+90), bx=tip[0]-head*Math.cos(t), by=tip[1]-head*Math.sin(t), nx=-Math.sin(t)*head*.55, ny=Math.cos(t)*head*.55;
    el('path',{d:'M'+tip+' L'+[bx+nx,by+ny]+' L'+[bx-nx,by-ny]+'Z',fill:col});
  }
  steps.forEach(function(s,i){var p=pt(-90+i*360/N), hot=i===0;
    el('circle',{cx:p[0],cy:p[1],r:r,fill:hot?'#E4003A':'#FFFFFF',stroke:hot?'#E4003A':'#E7E4DE','stroke-width':1});
    el('text',{x:p[0],y:p[1]-2,'text-anchor':'middle','font-size':30,'font-weight':600,fill:hot?'#fff':'#0E0F13'},s[0]);
    el('text',{x:p[0],y:p[1]+24,'text-anchor':'middle','font-size':12.5,fill:hot?'#fff':'#636874'},s[1]);});
  el('text',{x:cx,y:cy-8,'text-anchor':'middle','font-size':15,fill:'#636874'},'一轮平均');
  el('text',{x:cx,y:cy+40,'text-anchor':'middle','font-size':46,'font-weight':600,fill:'#0E0F13','font-family':'Helvetica Neue,Arial,PingFang SC'},'9 天');
})();
</script></body></html>
