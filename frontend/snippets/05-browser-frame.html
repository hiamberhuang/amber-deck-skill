<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>05 截图装进浏览器窗口</title>
<style>
.wrap{display:grid;grid-template-columns:400px 1fr;gap:60px;align-items:center;height:100%}
/* 浏览器框：圆角 12、顶栏 38、三个 11px 圆点；截图 contain 不裁、顶对齐 */
.browser{border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(20,18,22,.08),0 2px 4px rgba(20,18,22,.04),0 24px 56px rgba(20,18,22,.14);overflow:hidden}
.browser .bar{height:38px;background:#F1EFEA;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid var(--line)}
.browser .bar i{width:11px;height:11px;border-radius:50%;background:#D6D2CB}
.browser .bar .url{margin-left:14px;flex:0 0 300px;height:22px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:11.5px;line-height:20px;color:var(--muted);padding:0 10px}
.browser img{display:block;width:100%;aspect-ratio:1440/900;object-fit:cover;object-position:top}
h1{font-size:40px}
</style></head><body><div class="slide" style="padding-top:58px;padding-bottom:58px"><div class="wrap">
 <div><h1>一个工作台，看清本周每一条线索</h1><p class="sub">新增、有效率、响应时间和转化，在同一屏里对齐口径。</p></div>
 <div class="browser"><div class="bar" data-lint-skip="tiny-text low-contrast"><i></i><i></i><i></i><span class="url">leads.example.com/overview</span></div><img src="assets/shot-web.svg" alt="线索工作台总览截图"></div>
</div></div></body></html>
