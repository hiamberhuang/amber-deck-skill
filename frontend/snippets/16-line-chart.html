<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>16 折线图：线尾直接写名字</title>
<style>svg text{font-family:var(--font-sans)} .num{font-family:var(--font-num)}</style></head><body><div class="slide" style="padding-top:64px">
<h1 style="font-size:40px">分配规则上线那周，响应时间断崖式下降</h1>
<svg id="c" viewBox="0 0 1304 560" width="1304" height="560" style="margin-top:26px" role="img" aria-label="近八周首次响应时间"></svg>
<div class="note" data-lint-skip style="bottom:20px">16 · 最多 2–3 条线，主线 3px 强调色、对照线 2px 灰；图例写在线尾；事件用竖线 + 一句话标在图里；y 轴只留 3 条浅网格</div>
</div>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg',svg=document.getElementById('c');
  var weeks=['9/15','9/22','9/29','10/6','10/13','10/20','10/27','11/3'];
  var main=[236,251,228,244,240,62,11,4], ref=[190,196,188,201,194,186,192,189];
  var L=64,Rr=180,T=40,B=64,W=1304,H=560,pw=W-L-Rr,ph=H-T-B,ymax=300;
  var x=function(i){return L+i*pw/(weeks.length-1)},y=function(v){return T+ph-v/ymax*ph};
  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.appendChild(e);return e;}
  [0,100,200,300].forEach(function(v){el('path',{d:'M'+L+' '+y(v)+' H'+(L+pw),stroke:v?'#ECE9E3':'#BEB9B1','stroke-width':1});
    el('text',{x:L-14,y:y(v)+5,'text-anchor':'end','font-size':14,fill:'#6B707B',class:'num'},v);});
  el('text',{x:L,y:T-12,'font-size':14,fill:'#6B707B'},'首次响应时间（分钟）');
  weeks.forEach(function(w,i){el('text',{x:x(i),y:H-B+30,'text-anchor':'middle','font-size':14,fill:'#6B707B',class:'num'},w);});
  var ev=5; // 事件：10/20 上线
  el('path',{d:'M'+x(ev-.5)+' '+T+' V'+(T+ph),stroke:'#0E0F13','stroke-width':1,'stroke-dasharray':'3 4'});
  el('text',{x:x(ev-.5)+12,y:T+16,'font-size':15,'font-weight':600,fill:'#0E0F13'},'自动分配上线');
  var path=function(a){return a.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)}).join(' ')};
  el('path',{d:path(ref),fill:'none',stroke:'#C4BFB7','stroke-width':2,'stroke-linejoin':'round'});
  el('path',{d:path(main),fill:'none',stroke:'#E4003A','stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round'});
  var n=weeks.length-1;
  el('circle',{cx:x(n),cy:y(main[n]),r:6,fill:'#E4003A',stroke:'#F8F7F5','stroke-width':2});
  el('text',{x:x(n)+16,y:y(main[n])-6,'font-size':30,'font-weight':700,fill:'#E4003A',class:'num'},'4');
  el('text',{x:x(n)+38,y:y(main[n])-7,'font-size':15,fill:'#C50033'},'分钟');
  el('text',{x:x(n)+16,y:y(main[n])+16,'font-size':14,fill:'#636874'},'使用自动分配的团队');
  el('text',{x:x(n)+16,y:y(ref[n])+5,'font-size':14,fill:'#6B707B'},'未接入的团队 189');
  el('circle',{cx:x(0),cy:y(main[0]),r:4,fill:'#E4003A'});
  el('text',{x:x(0)+10,y:y(main[0])-12,'font-size':15,fill:'#636874',class:'num'},'236');
})();
</script></body></html>
