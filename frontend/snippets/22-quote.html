<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>22 引言页</title>
<style>
.q{position:absolute;left:150px;top:150px;width:1120px}
/* 引号是装饰，悬挂在版心外；正文左边线对齐 150px */
.q .mark{position:absolute;left:-92px;top:-30px;font-family:Georgia,"Songti SC",serif;font-size:190px;line-height:1;color:var(--accent)}
.q blockquote{font-size:72px;font-weight:600;line-height:1.34;letter-spacing:-.4px;text-wrap:balance}
.who{position:absolute;left:150px;bottom:96px;display:flex;align-items:center;gap:16px}
.who i{width:44px;height:1px;background:var(--ink)}
.who b{font-size:24px;font-weight:600} .who span{font-size:19px;color:var(--muted)}
</style></head><body><div class="slide">
<div class="q"><span class="mark" aria-hidden="true">“</span>
<blockquote><span style="white-space:nowrap">以前每天早上第一件事</span><span style="white-space:nowrap">是在群里抢线索，</span><span style="white-space:nowrap">现在打开手机，</span><span style="white-space:nowrap">该我跟的已经在那儿了。</span></blockquote></div>
<div class="who"><i></i><b>王敏</b><span>华东区销售主管，使用自动分配 4 周</span></div>
</div></body></html>
