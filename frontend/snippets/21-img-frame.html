<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>21 图片容器：比例归容器，焦点归图片</title>
<style>
.g{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px;margin-top:34px}
.g .frame{aspect-ratio:auto;height:470px}   /* 同一行：同一个高度 */
/* 思路参考 html-ppt-skill（MIT）的 .img-frame：容器管比例；这里按本项目令牌重写并加了内描边。
   图片永远不裸放。容器定比例和圆角，img 填满；焦点用 --pos 指到主体上 */
.frame{position:relative;aspect-ratio:var(--ratio,16/10);border-radius:10px;overflow:hidden;background:var(--soft)}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%)}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}   /* 1px 内描边，浅色图不会糊进底色 */
.frame.contain>img{object-fit:contain}       /* 截图、图表、logo：contain，不裁 */
figure{margin:0} figcaption{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.5}
figcaption b{color:var(--ink);font-weight:600}
</style></head><body><div class="slide" style="padding-top:64px">
<h1 style="font-size:40px">同一张图，三种裁法，主体都在</h1>
<div class="g">
 <figure><div class="frame" style="--pos:60% 72%"><img src="assets/scene.svg" alt="黄昏山谷里的营地"></div><figcaption><b>横幅主图</b>　--pos: 60% 72%，地平线压在下三分之一</figcaption></figure>
 <figure><div class="frame" style="--pos:80% 100%"><img src="assets/scene.svg" alt="营地近景"></div><figcaption><b>竖裁</b>　--pos: 80% 100%，焦点移到帐篷</figcaption></figure>
 <figure><div class="frame" style="--pos:0% 100%"><img src="assets/scene.svg" alt=""></div><figcaption><b>反例</b>　只改比例、不指焦点（这里落在左下），主体被裁出画面</figcaption></figure>
</div>
<div class="note" data-lint-skip>21 · 同一行的图片同一个高度；单张图的比例只用 21:9 / 16:9 / 16:10 / 4:3 / 1:1 / 4:5（--ratio）</div>
</div></body></html>
