<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="shot" content="1200x860"><link rel="stylesheet" href="_base.css"><title>04 固定画布缩放 + 打印</title>
<style>
/* 固定舞台 + 等比缩放是 HTML deck 的通行做法（huashu-design、frontend-slides 均为 MIT，写法各异）；此处为自写实现。
   画布内只用 px。整台 stage 等比缩放，四周留黑边；控件放在 stage 外面。 */
html,body{height:100%;background:#17161A;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0}
#stage .slide{position:absolute;inset:0;visibility:hidden}
#stage .slide.active{visibility:visible}
#hud{position:fixed;right:18px;bottom:14px;font:12px/1 var(--font-sans);color:#8d8a92}
.big{font-size:99px;font-weight:600;line-height:1.08;letter-spacing:-2px;margin-top:150px;text-wrap:balance}
/* 打印：撤掉缩放，一页一张，尺寸 = 画布 */
@page{size:1440px 810px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:none}
  #stage{position:static;transform:none!important;width:auto;height:auto}
  #stage .slide{position:relative;inset:auto;visibility:visible;break-after:page;break-inside:avoid}
  #stage .slide:last-child{break-after:auto}
  #hud{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important;transition:none!important}
}
</style></head><body>
<div id="stage">
  <section class="slide active"><div class="big">画布永远是<br>1440 × 810</div><p class="sub" style="font-size:25px;margin-top:28px">窗口是 1200 × 860：整页等比缩小，上下留边，断行一个字都不变。</p></section>
  <section class="slide"><div class="big">第二页</div></section>
</div>
<div id="hud"></div>
<script>
(function(){
  var W=1440,H=810,stage=document.getElementById('stage'),hud=document.getElementById('hud');
  var slides=[].slice.call(stage.children),i=Math.max(0,(parseInt(location.hash.slice(1))||1)-1);
  function fit(){var s=Math.min(innerWidth/W,innerHeight/H);
    stage.style.transform='translate('+(innerWidth-W*s)/2+'px,'+(innerHeight-H*s)/2+'px) scale('+s+')';
    hud.textContent=(i+1)+' / '+slides.length+' · scale '+s.toFixed(3);}
  function go(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,k){s.classList.toggle('active',k===i)});history.replaceState(null,'','#'+(i+1));fit();}
  addEventListener('resize',fit);
  addEventListener('keydown',function(e){if(/ArrowRight|PageDown| /.test(e.key))go(i+1);if(/ArrowLeft|PageUp/.test(e.key))go(i-1);});
  go(i);
})();
</script></body></html>
